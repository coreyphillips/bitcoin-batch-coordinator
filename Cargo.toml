[workspace]
members = [
    "coordinator",
    "participant",
    "common",
    "api-gateway",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Corey Phillips"]
license = "MIT"

[workspace.dependencies]
# Bitcoin & BDK
bdk = { version = "0.30", features = ["all-keys", "keys-bip39"] }
bitcoin = "0.30"
secp256k1 = "0.28"

# Pubky & Pkarr
pubky-messenger = { version = "0.3.0" }
pkarr = "3.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
blake3 = "1.5"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
